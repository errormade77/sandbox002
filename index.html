<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конструктор обложек</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel library" id="library" aria-label="Обложки">
        <header class="panel__header">
          <h1 class="panel__title">Обложки</h1>
        </header>
        <div class="library__bar">
          <span class="library__bar-label">На канвасе</span>
          <div class="stepper">
            <button type="button" id="viewCountDown" aria-label="Меньше обложек на канвасе">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <input
              id="viewCountInput"
              type="number"
              min="1"
              max="25"
              step="1"
              value="1"
              inputmode="numeric"
              aria-label="Сколько обложек на канвасе"
            />
            <button type="button" id="viewCountUp" aria-label="Больше обложек на канвасе">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <button class="library__import" id="importTable" type="button">Загрузить таблицу</button>
        <input id="tableFile" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden />
        <label class="library__provider" id="providerField" hidden>
          <span class="field__label">Провайдер</span>
          <select class="field__select" id="providerSelect" aria-label="Провайдер">
            <option value="">Выберите провайдера</option>
          </select>
        </label>
        <button class="library__import" id="createCovers" type="button" hidden>Создать обложки</button>
        <div class="library__grid" id="coverGrid"></div>
      </aside>

      <main class="stage" id="stage" aria-label="Холст обложки">
        <div class="board" id="board"></div>
        <div class="artboard-wrap" id="artboardWrap">
          <div class="artboard" id="artboard">
            <div class="artboard__guides" id="guides" aria-hidden="true"></div>
            <div class="artboard__content" id="content">
              <div class="text-frame" id="textFrame">
                <div
                  class="text-layer"
                  id="textLayer"
                  contenteditable="false"
                  spellcheck="false"
                  data-placeholder="Текст"
                  role="textbox"
                  aria-label="Текст обложки"
                ></div>
                <div class="text-fit" id="textFit" hidden></div>
              </div>
            </div>
          </div>
        </div>
        <input
          class="stage__name"
          id="coverNameInput"
          type="text"
          maxlength="120"
          placeholder="Без названия"
          spellcheck="false"
          autocomplete="off"
          aria-label="Имя обложки"
        />
        <p class="stage__label" id="sizeLabel">190 × 260 px</p>
        <div class="marquee" id="marquee" hidden></div>
      </main>

      <aside class="panel" aria-label="Параметры обложки">
        <header class="panel__header">
          <h1 class="panel__title" id="settingsTitle">Обложка</h1>
        </header>

        <p class="panel__group">Размер</p>
        <div class="size-row">
          <label class="field">
            <span class="field__label">Ширина</span>
            <span class="field__box">
              <input id="widthInput" type="number" min="100" max="4000" step="1" value="190" />
              <span class="field__unit">px</span>
            </span>
          </label>

          <button
            class="lock"
            id="aspectLock"
            type="button"
            aria-pressed="true"
            title="Сохранять пропорции"
            aria-label="Сохранять пропорции"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                class="lock__closed"
                d="M5.2 7.1V5.4a2.8 2.8 0 0 1 5.6 0v1.7M4.2 7.1h7.6v6.2H4.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
              <path
                class="lock__open"
                d="M5.2 7.1V5.1a2.8 2.8 0 0 1 5.3-1.2M4.2 7.1h7.6v6.2H4.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <label class="field">
            <span class="field__label">Высота</span>
            <span class="field__box">
              <input id="heightInput" type="number" min="100" max="4000" step="1" value="260" />
              <span class="field__unit">px</span>
            </span>
          </label>
        </div>
        <p class="panel__hint" id="ratioHint">19 : 26</p>

        <p class="panel__group">Границы</p>
        <div class="inset-row">
          <label class="field">
            <span class="field__label">Отступ</span>
            <span class="field__box">
              <input id="insetInput" type="number" min="0" max="200" step="1" value="16" />
              <span class="field__unit">px</span>
            </span>
          </label>
          <button
            class="lock"
            id="guidesToggle"
            type="button"
            aria-pressed="true"
            title="Скрыть направляющие"
            aria-label="Видимость сейф-зоны"
          >
            <svg class="eye__on" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M1.6 8s2.4-4.6 6.4-4.6S14.4 8 14.4 8s-2.4 4.6-6.4 4.6S1.6 8 1.6 8z" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="8" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <svg class="eye__off" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M1.6 8s2.4-4.6 6.4-4.6S14.4 8 14.4 8s-2.4 4.6-6.4 4.6S1.6 8 1.6 8z" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="8" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M3 13.2 13 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <p class="panel__group">Текст</p>
        <label class="field" id="titleField">
          <span class="field__label">Содержание</span>
          <textarea
            class="field__area"
            id="titleInput"
            rows="3"
            maxlength="500"
            placeholder="Название"
            autocomplete="off"
          ></textarea>
        </label>

        <div class="tabs" id="textModeTabs" role="tablist" aria-label="Режим текста">
          <button class="tabs__btn is-on" type="button" role="tab" data-fill="false" aria-selected="true">
            Обычный
          </button>
          <button class="tabs__btn" type="button" role="tab" data-fill="true" aria-selected="false">
            Умный
          </button>
        </div>

        <div class="fill-suggestions" id="fillSuggestions" hidden>
          <p class="field__label">Варианты набора</p>
          <div id="fillSuggestionList"></div>
        </div>

        <button class="font-btn" id="fontButton" type="button">
          <span class="font-btn__name" id="fontButtonName">Inter</span>
        </button>
        <select class="field__select" id="weightSelect" aria-label="Начертание"></select>

        <div class="pair-row pair-row--split" id="sizeControls">
          <label class="field" id="sizeField">
            <span class="field__label">Размер</span>
            <span class="field__box">
              <input id="titleSizeInput" type="number" min="8" max="400" step="1" value="24" />
              <span class="field__unit">px</span>
            </span>
          </label>
          <label class="field" id="fontMinField" hidden>
            <span class="field__label">Мин</span>
            <span class="field__box">
              <input id="fontMinInput" type="number" min="4" max="400" step="1" value="12" />
              <span class="field__unit">px</span>
            </span>
          </label>
          <label class="field" id="fontMaxField" hidden>
            <span class="field__label">Макс</span>
            <span class="field__box">
              <input id="fontMaxInput" type="number" min="4" max="400" step="1" value="80" />
              <span class="field__unit">px</span>
            </span>
          </label>
          <label class="field">
            <span class="field__label">Интерлиньяж</span>
            <span class="field__box">
              <input id="lineHeightInput" type="number" min="80" max="300" step="1" value="120" />
              <span class="field__unit">%</span>
            </span>
          </label>
        </div>

        <div class="pair-row pair-row--split">
          <label class="field">
            <span class="field__label">Трекинг</span>
            <span class="field__box">
              <input id="trackingInput" type="number" min="-40" max="80" step="1" value="0" />
              <span class="field__unit">%</span>
            </span>
          </label>
          <label class="field field--swatch">
            <span class="field__label">Цвет</span>
            <span class="swatch">
              <input id="titleColorInput" type="color" value="#ffffff" aria-label="Цвет текста" />
            </span>
          </label>
        </div>

        <p class="field__label">Регистр</p>
        <div class="seg" id="caseGroup" role="group" aria-label="Регистр">
          <button class="seg__btn is-on" type="button" data-case="none" title="Как есть" aria-pressed="true">Aa</button>
          <button class="seg__btn" type="button" data-case="upper" title="Капс" aria-pressed="false">AA</button>
          <button class="seg__btn" type="button" data-case="lower" title="Строчные" aria-pressed="false">aa</button>
        </div>

        <div id="alignBlock">
        <p class="field__label">Выключка</p>
        <div class="seg" id="alignGroup" role="group" aria-label="Выключка">
          <button class="seg__btn" type="button" data-align="left" title="По левому краю" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="seg__btn is-on" type="button" data-align="center" title="По центру" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M5 12.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="seg__btn" type="button" data-align="right" title="По правому краю" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M7 12.5h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="seg__btn" type="button" data-align="justify" title="По ширине" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 6.5h12M2 9.5h12M2 12.5h12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        </div>

        <p class="field__label">По вертикали</p>
        <div class="seg" id="valignGroup" role="group" aria-label="Вертикальная выключка">
          <button class="seg__btn" type="button" data-valign="top" title="Сверху" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M5 7h6v7H5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button class="seg__btn is-on" type="button" data-valign="middle" title="По центру" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M5 4h6v8H5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button class="seg__btn" type="button" data-valign="bottom" title="Снизу" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13h12M5 2h6v7H5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </aside>
    </div>

    <div class="font-menu" id="fontMenu" hidden>
      <input class="font-menu__search" id="fontSearch" type="search" placeholder="Поиск шрифта" autocomplete="off" />
      <div class="font-menu__list" id="fontList" role="listbox"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
